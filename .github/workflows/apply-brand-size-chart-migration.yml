name: Validate brand product size chart migration

on:
  workflow_dispatch:

# Source validation only. Schema changes must be deployed through the existing
# OFFFEED Lovable Cloud project after checking its live schema. This workflow
# never connects to a database or applies SQL.
permissions:
  contents: read

jobs:
  validate-size-chart-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate migration source
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/migrations/20261103214000_add_brand_product_size_charts.sql" || { echo "::error::Missing migration file: supabase/migrations/20261103214000_add_brand_product_size_charts.sql"; exit 1; }
          grep -qi "size_chart" "supabase/migrations/20261103214000_add_brand_product_size_charts.sql" || { echo "::error::Expected migration definition not found in supabase/migrations/20261103214000_add_brand_product_size_charts.sql"; exit 1; }
          echo "Migration source validation passed. No database connection or schema changes were made."
