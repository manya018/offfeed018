name: Validate HOME collection audience migration

on:
  workflow_dispatch:

# Source validation only. Schema changes must be deployed through the existing
# OFFFEED Lovable Cloud project after checking its live schema. This workflow
# never connects to a database or applies SQL.
permissions:
  contents: read

jobs:
  validate-home-audience-migration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate migration source
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/migrations/20261108000000_add_home_collection_audience.sql" || { echo "::error::Missing migration file: supabase/migrations/20261108000000_add_home_collection_audience.sql"; exit 1; }
          grep -qi "home" "supabase/migrations/20261108000000_add_home_collection_audience.sql" || { echo "::error::Expected migration definition not found in supabase/migrations/20261108000000_add_home_collection_audience.sql"; exit 1; }
          echo "Migration source validation passed. No database connection or schema changes were made."
