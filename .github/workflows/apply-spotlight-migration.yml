name: Apply Spotlight campaign migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-spotlight-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply Spotlight campaign schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing repository secret: SUPABASE_DB_URL"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261109000000_add_spotlight_campaigns.sql
