name: Validate Spotlight campaign migrations

on:
  workflow_dispatch:

# Source validation only. Schema changes must be deployed through the existing
# OFFFEED Lovable Cloud project after checking its live schema. This workflow
# never connects to a database or applies SQL.
permissions:
  contents: read

jobs:
  validate-spotlight-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate migration source
        shell: bash
        run: |
          set -euo pipefail
          test -s "supabase/migrations/20261109000000_add_spotlight_campaigns.sql" || { echo "::error::Missing migration file: supabase/migrations/20261109000000_add_spotlight_campaigns.sql"; exit 1; }
          test -s "supabase/migrations/20261109010000_add_spotlight_analytics.sql" || { echo "::error::Missing migration file: supabase/migrations/20261109010000_add_spotlight_analytics.sql"; exit 1; }
          test -s "supabase/migrations/20261110000000_spotlight_weekly_booking.sql" || { echo "::error::Missing migration file: supabase/migrations/20261110000000_spotlight_weekly_booking.sql"; exit 1; }
          grep -qi "spotlight_campaigns" "supabase/migrations/20261109000000_add_spotlight_campaigns.sql" || { echo "::error::Expected migration definition not found in supabase/migrations/20261109000000_add_spotlight_campaigns.sql"; exit 1; }
          grep -qi "spotlight" "supabase/migrations/20261109010000_add_spotlight_analytics.sql" || { echo "::error::Expected migration definition not found in supabase/migrations/20261109010000_add_spotlight_analytics.sql"; exit 1; }
          grep -qi "spotlight" "supabase/migrations/20261110000000_spotlight_weekly_booking.sql" || { echo "::error::Expected migration definition not found in supabase/migrations/20261110000000_spotlight_weekly_booking.sql"; exit 1; }
          echo "Migration source validation passed. No database connection or schema changes were made."
