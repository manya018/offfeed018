name: Deploy OFFFEED sale notification dispatcher

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/sale-notification-dispatch/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-sale-notifications.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: wrqkpxvbbdsvfgvisyte
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: latest
      - name: Deploy sale notification dispatcher
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN repository secret" && exit 1)
          supabase functions deploy sale-notification-dispatch --project-ref "$SUPABASE_PROJECT_ID"
