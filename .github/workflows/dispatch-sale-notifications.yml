name: Dispatch OFFFEED sale notifications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due sale notifications
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SALE_NOTIFICATION_CRON_SECRET: ${{ secrets.SALE_NOTIFICATION_CRON_SECRET }}
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SALE_NOTIFICATION_CRON_SECRET" || (echo "Missing SALE_NOTIFICATION_CRON_SECRET secret" && exit 1)
          curl --fail-with-body --silent --show-error \
            --request POST "$SUPABASE_URL/functions/v1/sale-notification-dispatch" \
            --header "Authorization: Bearer $SALE_NOTIFICATION_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data "{}"
