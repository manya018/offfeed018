name: Validate OFFFEED Trust migration assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-offfeed-trust-database.yml"
      - "drizzle/migrations/0000_brand_fraud_evidence.sql"
      - "drizzle/migrations/0001_order_evidence_storage_policies.sql"
      - "drizzle/migrations/0005_secure_order_evidence.sql"
      - "docs/offfeed-trust-deployment.md"
  workflow_dispatch:

# Lovable Cloud owns the managed backend. This workflow validates repository
# assets only; it does not connect to or claim to verify the live database.
permissions:
  contents: read

jobs:
  validate-trust-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate OFFFEED Trust migration assets
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            drizzle/migrations/0000_brand_fraud_evidence.sql \
            drizzle/migrations/0001_order_evidence_storage_policies.sql \
            drizzle/migrations/0005_secure_order_evidence.sql \
            docs/offfeed-trust-deployment.md; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required OFFFEED Trust asset is missing or empty: $file"
              exit 1
            fi
          done

          grep -q "CREATE TABLE public.dispatch_evidence" drizzle/migrations/0000_brand_fraud_evidence.sql
          grep -q "CREATE TABLE public.return_evidence" drizzle/migrations/0000_brand_fraud_evidence.sql
          grep -q "CREATE POLICY" drizzle/migrations/0001_order_evidence_storage_policies.sql
          grep -q "request_offfeed_return_with_evidence" drizzle/migrations/0005_secure_order_evidence.sql
          grep -q "REVOKE INSERT, UPDATE, DELETE ON public.return_evidence" drizzle/migrations/0005_secure_order_evidence.sql

          echo "OFFFEED Trust repository assets are present and contain the expected schema/security definitions."
          echo "This is a source validation only. It does not prove that Lovable Cloud has applied the migrations.";
