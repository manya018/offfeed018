name: Validate OFFFEED Trust migration assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-offfeed-trust-database.yml"
      - "supabase/migrations/20261116000000_add_offfeed_trust_evidence.sql"
      - "drizzle/migrations/0000_brand_fraud_evidence.sql"
      - "drizzle/migrations/0001_order_evidence_storage_policies.sql"
      - "drizzle/migrations/0005_secure_order_evidence.sql"
      - "docs/offfeed-trust-deployment.md"
  workflow_dispatch:

# Lovable Cloud owns the managed backend. This workflow validates repository
# assets only; it does not connect to or claim to verify the live database.
permissions:
  contents: read

jobs:
  validate-trust-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate OFFFEED Trust migration assets
        shell: bash
        run: |
          set -euo pipefail

          for file in \
            supabase/migrations/20261116000000_add_offfeed_trust_evidence.sql \
            drizzle/migrations/0000_brand_fraud_evidence.sql \
            drizzle/migrations/0001_order_evidence_storage_policies.sql \
            drizzle/migrations/0005_secure_order_evidence.sql \
            docs/offfeed-trust-deployment.md; do
            if [[ ! -s "$file" ]]; then
              echo "::error::Required OFFFEED Trust asset is missing or empty: $file"
              exit 1
            fi
          done

          migration="supabase/migrations/20261116000000_add_offfeed_trust_evidence.sql"
          grep -q "CREATE TABLE IF NOT EXISTS public.dispatch_evidence" "$migration"
          grep -q "CREATE TABLE IF NOT EXISTS public.return_evidence" "$migration"
          grep -q "request_offfeed_return_with_evidence" "$migration"
          grep -q "OFFFEED order parties can view exact evidence" "$migration"
          grep -q "REVOKE INSERT, UPDATE, DELETE ON public.return_evidence FROM authenticated" "$migration"
          grep -q "ON CONFLICT (id) DO NOTHING" "$migration"
          grep -q "duplicate dispatch_evidence rows exist" "$migration"
          grep -q "duplicate return_evidence rows exist" "$migration"

          echo "OFFFEED Trust migration source and security guards are present."
          echo "This is source validation only; it does not prove Lovable Cloud has applied the migration."
